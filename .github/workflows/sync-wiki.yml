name: Sync wiki from docs

on:
    push:
        branches: [main]
        paths:
            - 'docs/**'
            - 'scripts/sync-wiki.mjs'
            - '.github/workflows/sync-wiki.yml'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    sync-wiki:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Clone or init wiki repository
              env:
                  WIKI_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
              run: |
                  if git clone "$WIKI_URL" wiki-repo 2>/dev/null; then
                    echo "Wiki cloned"
                  else
                    echo "Wiki empty or missing — initializing"
                    mkdir wiki-repo
                    cd wiki-repo
                    git init -b master
                    git remote add origin "$WIKI_URL"
                  fi

            - name: Copy docs into wiki
              run: node scripts/sync-wiki.mjs wiki-repo

            - name: Push wiki
              working-directory: wiki-repo
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  if git diff --staged --quiet; then
                    echo "Wiki already up to date"
                  else
                    git commit -m "Sync from docs (${{ github.sha }})"
                    git push origin HEAD:master
                  fi
