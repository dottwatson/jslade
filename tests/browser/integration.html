<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Jslade — integration tests</title>
        <style>
            body { font-family: ui-monospace, monospace; margin: 1rem; }
            .ok::before { content: '✓ '; color: #080; }
            .ko::before { content: '✗ '; color: #c00; }
            .ko { color: #c00; }
            #stage { position: absolute; left: -9999px; }
        </style>
    </head>
    <body>
        <ul id="out"></ul>
        <div id="stage"></div>
        <script src="../../dist/jslade.js"></script>
        <script>
            const out = document.getElementById('out')
            let passed = 0
            let failed = 0

            function assert(condition, message) {
                const li = document.createElement('li')
                li.className = condition ? 'ok' : 'ko'
                li.textContent = message
                out.appendChild(li)
                condition ? passed++ : failed++
            }

            const tick = () => new Promise((r) => setTimeout(r, 0))

            async function run() {
                // import + start + placeholder
                {
                    const raw =
                        '<noembed name="int/hello">' +
                        '<script>props({ name: "world" })<\/script>' +
                        '<template><p class="g">{{ name }}</p></template>' +
                        '</noembed>'

                    const host = document.createElement('div')
                    host.innerHTML = '<jslade name="int/hello" props=\'{ "name": "Ada" }\'></jslade>'
                    document.getElementById('stage').appendChild(host)

                    Jslade.import({ 'int/hello': raw })
                    Jslade.start({ root: host })

                    const el = host.querySelector('jslade')
                    assert(el && el.component, 'start() mounts placeholder')
                    assert(el.component.state.name === 'Ada', 'props merge over defaults')
                    assert(host.querySelector('.g').textContent === 'Ada', 'template renders')
                }

                // render() static HTML
                {
                    Jslade.compile('int/static', {
                        script: 'props({ x: 1 })',
                        markup: '<span>{{ x }}</span>',
                        scopedStyles: '',
                        scopeTargets: false,
                    })
                    const html = Jslade.render('int/static', { x: 42 })
                    assert(html.includes('42'), 'render() returns expanded HTML')
                    assert(!html.includes('data-jsd-'), 'render() strips internal markers')
                }

                // reactive update via renderTo
                {
                    Jslade.compile('int/live', {
                        script: 'props({ n: 0 })',
                        markup: '<b class="n">{{ n }}</b>',
                        scopedStyles: '',
                        scopeTargets: false,
                    })
                    const box = document.createElement('div')
                    document.getElementById('stage').appendChild(box)
                    const inst = Jslade.renderTo(box, 'int/live', { n: 1 })
                    inst.state.n = 9
                    await tick()
                    assert(box.querySelector('.n').textContent === '9', 'state change re-renders')
                }

                // Wire between instances (receiver must mount before sender)
                {
                    Jslade.compile('int/wire-a', {
                        script: 'mount(function() { this.wire("int/chan").send({ from: "a" }) })',
                        markup: '<i>a</i>',
                        scopedStyles: '',
                        scopeTargets: false,
                    })
                    Jslade.compile('int/wire-b', {
                        script: 'props({ msg: "" })\nmount(function() { this.wire("int/chan").receive(function(d) { this.msg = d.from }) })',
                        markup: '<i>{{ msg }}</i>',
                        scopedStyles: '',
                        scopeTargets: false,
                    })
                    const a = document.createElement('div')
                    const b = document.createElement('div')
                    document.getElementById('stage').append(a, b)
                    const binst = Jslade.renderTo(b, 'int/wire-b', {})
                    await tick()
                    Jslade.renderTo(a, 'int/wire-a', {})
                    await tick()
                    assert(binst.state.msg === 'a', 'Wire deliver between components')
                }

                // last send is readable; late receive is replayed; clear empties without notify
                {
                    Jslade.compile('int/theme-set', {
                        script: 'mount(function() { this.wire("int/theme").send("dark") })',
                        markup: '<i></i>',
                        scopedStyles: '',
                        scopeTargets: false,
                    })
                    Jslade.compile('int/theme-late', {
                        script: 'props({ theme: "" })\nmount(function() { this.wire("int/theme").receive(function(v) { this.theme = v }) })',
                        markup: '<i></i>',
                        scopedStyles: '',
                        scopeTargets: false,
                    })
                    const box = document.createElement('div')
                    document.getElementById('stage').appendChild(box)
                    Jslade.renderTo(box, 'int/theme-set', {})
                    await tick()
                    assert(Jslade.wire('int/theme').get() === 'dark', 'Jslade.wire().get() reads last send')
                    assert(Jslade.wire('int/theme').get('light') === 'dark', 'get fallback unused when populated')
                    const lateBox = document.createElement('div')
                    document.getElementById('stage').appendChild(lateBox)
                    const late = Jslade.renderTo(lateBox, 'int/theme-late', {})
                    await tick()
                    assert(late.state.theme === 'dark', 'late receive is replayed last send')
                    Jslade.wire('int/theme').send('light')
                    await tick()
                    assert(Jslade.wire('int/theme').get() === 'light', 'anyone can send')
                    const received = []
                    Jslade.wire('int/theme').receive(function (v) {
                        received.push(v)
                    })
                    received.length = 0
                    Jslade.wire('int/theme').clear()
                    assert(Jslade.wire('int/theme').get() === undefined, 'clear empties the last value')
                    assert(Jslade.wire('int/theme').get('dark') === 'dark', 'get fallback after clear')
                    assert(received.length === 0, 'clear does not notify receive')
                }

                // localWire stays inside one parent tree
                {
                    Jslade.compile('int/chip', {
                        script:
                            'props({ taskId: 0 })\nfunction ping() { this.parent.localWire("ping").send({ id: this.taskId }) }',
                        markup: '<i></i>',
                        scopedStyles: '',
                        scopeTargets: false,
                    })
                    Jslade.compile('int/board', {
                        script: 'props({ last: 0 })\nmount(function() { this.localWire("ping").receive(function(d) { this.last = d.id }) })',
                        markup: '@component("int/chip", { taskId: 7 })',
                        scopedStyles: '',
                        scopeTargets: false,
                    })
                    const hostA = document.createElement('div')
                    const hostB = document.createElement('div')
                    document.getElementById('stage').append(hostA, hostB)
                    const boardA = Jslade.renderTo(hostA, 'int/board', {})
                    const boardB = Jslade.renderTo(hostB, 'int/board', {})
                    await tick()
                    boardA.children[0].ping()
                    boardB.children[0].ping()
                    await tick()
                    assert(boardA.state.last === 7, 'localWire reaches the parent')
                    assert(boardB.state.last === 7, 'second tree has its own localWire')
                    boardA.localWire('ping').send({ id: 9 })
                    await tick()
                    assert(boardA.state.last === 9, 'parent send stays on its localWire')
                    assert(boardB.state.last === 7, 'sibling tree does not see the other localWire')
                }

                // bootstrap alias
                {
                    assert(typeof Jslade.bootstrap === 'function', 'bootstrap() is exported')
                }

                // list() shows compiled names
                {
                    const names = Jslade.list()
                    assert(names.includes('int/static'), 'list() includes compiled templates')
                }

                window.__results = { passed, failed }
            }

            run().catch((err) => {
                assert(false, 'crashed: ' + err.message)
                window.__results = { passed, failed }
            })
        </script>
    </body>
</html>
